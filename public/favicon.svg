<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background subtle warm circular glow -->
  <rect width="512" height="512" rx="100" fill="#0B1E1C"/>
  
  <!-- Outer Gold Concentric Halo Arches -->
  <path d="M 68 370 A 188 188 0 0 1 444 370" stroke="#C59B27" stroke-width="9" stroke-linecap="round"/>
  <path d="M 92 370 A 164 164 0 0 1 420 370" stroke="#C59B27" stroke-width="6" stroke-linecap="round"/>

  <!-- Architectural 5-House Skyline (Emerald Silhouette) -->
  <!-- 1. Center Tall House -->
  <path d="M 220 180 L 256 142 L 292 180 V 370 H 220 Z" stroke="#10B981" stroke-width="7" stroke-linejoin="round" fill="#0B1E1C"/>
  <rect x="246" y="196" width="20" height="20" rx="3" stroke="#10B981" stroke-width="4" fill="none"/>

  <!-- 2. Mid Left House -->
  <path d="M 166 220 L 202 185 L 220 202 V 370 H 166 Z" stroke="#10B981" stroke-width="7" stroke-linejoin="round" fill="#0B1E1C"/>
  <rect x="180" y="235" width="16" height="16" rx="2" stroke="#10B981" stroke-width="4" fill="none"/>

  <!-- 3. Mid Right House -->
  <path d="M 292 202 L 310 185 L 346 220 V 370 H 292 Z" stroke="#10B981" stroke-width="7" stroke-linejoin="round" fill="#0B1E1C"/>
  <rect x="316" y="235" width="16" height="16" rx="2" stroke="#10B981" stroke-width="4" fill="none"/>

  <!-- 4. Outer Left House -->
  <path d="M 122 258 L 152 230 L 166 244 V 370 H 122 Z" stroke="#10B981" stroke-width="7" stroke-linejoin="round" fill="#0B1E1C"/>
  <rect x="134" y="276" width="14" height="14" rx="2" stroke="#10B981" stroke-width="3.5" fill="none"/>

  <!-- 5. Outer Right House -->
  <path d="M 346 244 L 360 230 L 390 258 V 370 H 346 Z" stroke="#10B981" stroke-width="7" stroke-linejoin="round" fill="#0B1E1C"/>
  <rect x="364" y="276" width="14" height="14" rx="2" stroke="#10B981" stroke-width="3.5" fill="none"/>

  <!-- Center Portal Arch -->
  <path d="M 166 370 V 270 A 90 90 0 0 1 346 270 V 370" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
  <path d="M 182 370 V 282 A 74 74 0 0 1 330 282 V 370" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>

  <!-- Base Foundation Beam -->
  <line x1="100" y1="370" x2="412" y2="370" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>

  <!-- Sacred OM (ॐ) Symbol (Gold) -->
  <g id="sacred-om">
    <text x="256" y="248" text-anchor="middle" fill="#FBBF24" font-size="46" font-family="'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-weight="900">ॐ</text>
  </g>

  <!-- Sacred Lotus Flower in Portal (Emerald & Gold) -->
  <g id="lotus" transform="translate(256, 342)">
    <!-- Center Tall Petal -->
    <path d="M 0 -48 C -18 -24 -18 6 0 20 C 18 6 18 -24 0 -48 Z" stroke="#34D399" stroke-width="5.5" fill="#0B1E1C" stroke-linejoin="round"/>
    <!-- Inner Left Petal -->
    <path d="M 0 20 C -22 12 -42 -2 -34 -20 C -18 -12 -8 6 0 20 Z" stroke="#34D399" stroke-width="5" fill="#0B1E1C" stroke-linejoin="round"/>
    <!-- Inner Right Petal -->
    <path d="M 0 20 C 22 12 42 -2 34 -20 C 18 -12 8 6 0 20 Z" stroke="#34D399" stroke-width="5" fill="#0B1E1C" stroke-linejoin="round"/>
    <!-- Outer Left Wing -->
    <path d="M 0 20 C -36 16 -62 4 -54 -10 C -38 -2 -20 12 0 20 Z" stroke="#34D399" stroke-width="4.5" fill="#0B1E1C" stroke-linejoin="round"/>
    <!-- Outer Right Wing -->
    <path d="M 0 20 C 36 16 62 4 54 -10 C 38 -2 20 12 0 20 Z" stroke="#34D399" stroke-width="4.5" fill="#0B1E1C" stroke-linejoin="round"/>
    <!-- Bottom Cradle Loop -->
    <path d="M -48 24 Q 0 34 48 24" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
